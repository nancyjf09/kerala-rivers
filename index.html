@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201b;--card:#1d2b25;--ink:#eef3ef;--mut:#9db0a6;--line:#35473f;--acc:#3fbf8f;--accink:#08201a;--bad:#ff7a66;--ghost:#2a3a33;--sea:#1a2e38}}
:root[data-theme="dark"]{--bg:#14201b;--card:#1d2b25;--ink:#eef3ef;--mut:#9db0a6;--line:#35473f;--acc:#3fbf8f;--accink:#08201a;--bad:#ff7a66;--ghost:#2a3a33;--sea:#1a2e38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-size:1.7rem;margin:0 0 6px}h2{margin:0 0 10px}
p{color:var(--mut);line-height:1.5}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 20px;background:var(--acc);color:var(--accink);font-weight:700}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 12px}
label{font-size:.85rem;color:var(--mut)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}
.center{text-align:center}
.code{font-size:3.4rem;letter-spacing:.25em;font-weight:800;color:var(--acc);margin:6px 0}
.big{font-size:6rem;font-weight:800;color:var(--acc)}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{min-height:44px;border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:8px;background:var(--card);border:1px solid var(--line)}
.toast.ok{background:#1b7f5c;color:#fff;border-color:#1b7f5c}.toast.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
#board{width:100%;max-height:72vh;background:var(--sea);border-radius:16px;touch-action:none;display:block;cursor:crosshair}
.lab{font-size:7px;font-weight:800;fill:#fff;stroke:#0008;stroke-width:2.2px;paint-order:stroke;text-anchor:middle;pointer-events:none}
.lb{display:grid;grid-template-columns:34px 1fr 70px;gap:8px;align-items:center;margin:8px 0}
.bar{height:12px;background:var(--ghost);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.stats{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}.stat{flex:1;min-width:110px;background:var(--bg);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.6rem}
.err{color:var(--bad);font-weight:600}
.hide{display:none!important}
.key p{margin:4px 0;font-size:.92rem;color:var(--ink)}

// ---------- Live room plumbing (PeerJS — free public WebRTC, no accounts) ----------
// Teacher hosts a room as Peer id "kerala-rivers-host-<code>"; students connect to it.
// Interface: presence(), peers(), onPeers(), leave().
function getRoom(code,isHost){
 if(typeof Peer==="undefined")return Promise.reject(new Error("nolib"));
 const hostId="kerala-rivers-host-"+code.toLowerCase();
 return new Promise((resolve,reject)=>{
  const peer=isHost?new Peer(hostId):new Peer();
  const listeners=new Set(),conns=new Map();
  let roster=[],tPres=null,opened=false;
  peer.on("open",()=>{
   if(opened)return;opened=true;
   const me={presence:{},isMe:true,sameTab:true,id:peer.id};
   const emit=()=>listeners.forEach(f=>f());
   const bcast=m=>{for(const c of conns.values()){try{if(c.open)c.send(m)}catch(e){}}};
   const sendRoster=()=>{if(isHost)bcast({t:"roster",d:roster})};
   const api={
    peers(){
     const arr=roster.map(r=>({presence:r.p,isMe:r.id===peer.id,sameTab:r.id===peer.id,id:r.id}));
     if(isHost){arr.push(me);return arr}
     const mine={presence:me.presence,isMe:true,sameTab:true,id:peer.id};
     const i=arr.findIndex(r=>r.id===peer.id);
     i>=0?arr[i]=mine:arr.push(mine);
     if(tPres)arr.push({presence:tPres,isMe:false,sameTab:false,id:"host"});
     return arr},
    presence(d){me.presence=d;d.id=peer.id;bcast({t:"p",d})},
    onPeers(f){listeners.add(f);return()=>listeners.delete(f)},
    leave(){try{peer.destroy()}catch(e){}}
   };
   if(isHost){
    peer.on("connection",c=>{
     c.on("open",()=>{conns.set(c.peer,c);try{c.send({t:"p",d:me.presence})}catch(e){}sendRoster()});
     c.on("data",m=>{
      if(m&&m.t==="p"){
       const entry={id:c.peer,p:m.d},i=roster.findIndex(r=>r.id===c.peer);
       i>=0?roster[i]=entry:roster.push(entry);
       sendRoster();emit()}});
     c.on("close",()=>{conns.delete(c.peer);roster=roster.filter(r=>r.id!==c.peer);sendRoster();emit()});
    });
    resolve(api);
   }else{
    const c=peer.connect(hostId,{reliable:true});
    conns.set("host",c);
    const to=setTimeout(()=>{reject(new Error("noclass"))},9000);
    peer.on("error",e=>{
     if(e&&e.type==="peer-unavailable"){clearTimeout(to);reject(new Error("noclass"))}
    });
    c.on("open",()=>{clearTimeout(to);resolve(api)});
    c.on("data",m=>{
     if(m.t==="p"){tPres=m.d;emit()}
     if(m.t==="roster"){roster=m.d;emit()}
    });
    c.on("close",()=>{const e=$("#ts");if(e&&screen==="play"){e.textContent="⚠️ Connection to the teacher was lost.";e.className="toast bad"}});
   }
  });
  peer.on("error",e=>{if(!opened)reject(e)});
 });
}

async function teacher(){
 role="teacher";let st=0,ep=1,startAt=0;
 const gen=()=>Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");
 let code=gen();
 const n=el(`<div class="card"><div class="center"><p>Students: open this page → “I’m a student” → enter their name and the code below. Everyone just needs internet — no sign-in.</p><div class="code" id="cd">•••••</div></div>
 <div class="stats"><div class="stat"><b id="sj">0</b>joined</div><div class="stat"><b id="sp">0</b>playing</div><div class="stat"><b id="sf">0</b>finished</div><div class="stat"><b id="se">0:00</b>elapsed</div></div>
 <div class="row" style="margin-bottom:8px"><button id="go">▶ Start for everyone</button><button class="alt" id="end" disabled>■ End game</button><button class="alt" id="rs">↺ Reset lobby</button></div>
 <p id="msg" class="err"></p><h2>🏆 Top 5</h2><div id="lb"><p>Setting up the class…</p></div></div>`);
 show(n);
 n.querySelector("#cd").textContent=code;

 let room=null;
 try{ room=await getRoom(code,true); }
 catch(e){
  if(e&&e.type==="unavailable-id"){ // code already taken on the public network: make a fresh one
   code=gen();n.querySelector("#cd").textContent=code;
   try{ room=await getRoom(code,true); }catch(e2){ room=null; }
  }
 }
 if(!room){n.querySelector("#msg").textContent="Couldn’t create the live room. Check the internet connection and reload the page.";n.querySelector("#lb").innerHTML="<p>Live connection unavailable.</p>";return}
 R=room;
 const setP=()=>R.presence({role:"t",st,ep,code});setP();
 n.querySelector("#go").onclick=()=>{st=1;startAt=Date.now();setP();n.querySelector("#go").disabled=true;n.querySelector("#end").disabled=false};
 n.querySelector("#end").onclick=()=>{st=2;setP();n.querySelector("#end").disabled=true};
 n.querySelector("#rs").onclick=()=>{st=0;ep++;startAt=0;setP();n.querySelector("#go").disabled=false;n.querySelector("#end").disabled=true};
 const draw=()=>{const S=R.peers().filter(p=>p.presence.role==="s");
  const top=[...S].sort((a,b)=>(b.presence.sc||0)-(a.presence.sc||0)||(a.presence.tm||0)-(b.presence.tm||0)).slice(0,5);
  n.querySelector("#sj").textContent=S.length;n.querySelector("#sf").textContent=S.filter(p=>p.presence.fin).length;
  n.querySelector("#sp").textContent=S.filter(p=>!p.presence.fin&&(p.presence.pl||0)>=0&&st===1).length;
  const lb=n.querySelector("#lb");if(!S.length){lb.innerHTML="<p>Waiting for students to join…</p>";return}
  lb.replaceChildren(...top.map((p,i)=>{const q=p.presence;
   const r=el(`<div class="lb"><b>${["🥇","🥈","🥉","4","5"][i]}</b><div><div><b class="nm"></b> <small style="color:var(--mut)">${q.pl||0}/${D.length} found${q.fin?" · done "+fmt(q.tm):""}</small></div><div class="bar"><i style="width:${Math.min(100,(q.sc||0)/16)}%"></i></div></div><b style="text-align:right">${q.sc||0}</b></div>`);
   r.querySelector(".nm").textContent=q.n||"Student";return r}))};
 unPeers=R.onPeers(draw);draw();
 setInterval(()=>{if(st===1)n.querySelector("#se").textContent=fmt((Date.now()-startAt)/1000)},500)}

function joinScreen(){

 show(n);n.querySelector("#b").onclick=home;
 n.querySelector("#j").onclick=async()=>{
  const nm=n.querySelector("#nm").value.trim(),cd=n.querySelector("#cd").value.trim().toUpperCase(),e=n.querySelector("#e");
  if(!nm||cd.length<5){e.textContent="Please enter your name and the 5-character code.";return}
  e.textContent="Connecting…";me={name:nm,code:cd};

  catch(err){
   e.textContent=(err&&err.message==="noclass")?"No class found with that code. Check it and try again.":"Couldn’t connect. Check the internet and try again.";
   return}
  R=r;R.presence({role:"s",n:nm,sc:0,pl:0,fin:0,tm:0});

  unPeers=R.onPeers(()=>{
   const t=R.peers().find(p=>p.presence.role==="t");
   if(!t||!t.presence.code||t.presence.code!==cd)return;
   if(!found){found=true;myEp=t.presence.ep;lobby()}

   if(screen==="lobby"){$("#cnt")&&($("#cnt").textContent=R.peers().filter(p=>p.presence.role==="s").length);if(t.presence.st===1)startCountdown()}
   if(t.presence.st===2&&screen==="play")finish(true)});
  setTimeout(()=>{if(!found){e.textContent="No class found with that code. Check it and try again.";try{unPeers&&unPeers();R.leave()}catch(x){}}},10000)}}

let G=null,dPaths=[];
function startCountdown(){screen="count";let c=3;const n=el(`<div class="card center"><p>Get ready…</p><div class="big" id="c">3</div></div>`);show(n);
 const t=setInterval(()=>{c--;if(c<=0){clearInterval(t);play()}else n.querySelector("#c").textContent=c},1000)}
function stopTick(){clearInterval(tickId)}
function play(){
 screen="play";
 const order=[...D.keys()].sort(()=>Math.random()-.5);
 G={order,i:0,score:0,placed:0,wrong:0,t0:Date.now(),p0:Date.now(),done:false,pw:0};
 const n=el(`<div><div class="hud"><span class="pill">⭐ <span id="sc">0</span></span><span class="pill">🌊 <span id="pl">0</span>/${D.length}</span><span class="pill">⏱ <span id="tm">0:00</span></span><span class="pill" id="nx"></span></div><div class="toast" id="ts">Read the rivers on the card, then click their district on the map.</div>
 <div class="card" style="margin-bottom:10px;text-align:center;padding:14px"><div id="pieceCat" style="font-size:.8rem;font-weight:700;color:var(--mut);letter-spacing:.04em"></div><div id="pieceNames" style="margin-top:5px"></div></div>
 <svg id="board" viewBox="-6 -6 560 520" style="cursor:pointer"><g id="g0"></g><g id="g2"></g><g id="g3"></g></svg></div>`);
 show(n);const svg=$("#board");
 dPaths=D.map(d=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",d.d);p.setAttribute("fill","var(--ghost)");p.setAttribute("stroke","var(--mut)");p.setAttribute("stroke-width","1");p.setAttribute("stroke-dasharray","3 2");p.style.cursor="pointer";$("#g0").appendChild(p);return p});
 spawn();
 tickId=setInterval(()=>{if(G&&!G.done)$("#tm").textContent=fmt((Date.now()-G.t0)/1000)},250);
 let hover=-1;
 const pt=e=>{const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse())};
 const setHover=i=>{if(G.done)return;if(i===hover)return;if(hover>=0&&!dPaths[hover].dataset.done){const p=dPaths[hover];p.setAttribute("stroke","var(--mut)");p.setAttribute("stroke-width","1");p.setAttribute("stroke-dasharray","3 2")}
  hover=i;if(i>=0&&!dPaths[i].dataset.done){const p=dPaths[i];p.setAttribute("stroke","var(--acc)");p.setAttribute("stroke-width","2.5");p.setAttribute("stroke-dasharray","none")}};
 svg.onpointermove=e=>{const s=pt(e);setHover(districtAt(s.x,s.y))};
 svg.onpointerup=e=>{if(G.done)return;const s=pt(e);const hit=districtAt(s.x,s.y);if(hit>=0)attempt(hit)};
}
function spawn(){
 const idx=G.order[G.i],rivers=RIV[idx];
 $("#pieceCat").textContent="🌊  THESE RIVERS FLOW THROUGH… · CARD "+(G.i+1)+" OF "+D.length;
 $("#pieceNames").replaceChildren(...rivers.map(rv=>{const d=document.createElement("div");d.style.cssText="font-size:1.05rem;font-weight:800;line-height:1.4";d.textContent=rv;return d}));
 G.pw=0;G.p0=Date.now();$("#nx").textContent="Card "+(G.i+1)+" of "+D.length;}
function toast(t,c){const e=$("#ts");e.textContent=t;e.className="toast "+(c||"")}
function sync(fin){if(R&&role==="student")R.presence({role:"s",n:me.name,sc:G.score,pl:G.placed,fin:fin?1:0,tm:Math.round((Date.now()-G.t0)/1000)})}
function attempt(hit){
 if(G.done||dPaths[hit].dataset.done)return; // already-coloured districts are not clickable
 const target=G.order[G.i];
 if(sameRivers(RIV[hit],RIV[target])){
  const sec=(Date.now()-G.p0)/1000,pts=pieceScore(G.pw,sec);G.score+=pts;G.placed++;
  const d=D[hit];
  const pl=dPaths[hit];pl.dataset.done="1";pl.setAttribute("fill",d.col);pl.setAttribute("stroke","#fff");pl.setAttribute("stroke-width","1.2");pl.setAttribute("stroke-dasharray","none");
  const t=document.createElementNS(NS,"text");t.setAttribute("x",d.cx);t.setAttribute("y",d.cy+2.5);t.setAttribute("class","lab");t.textContent=d.name;$("#g2").appendChild(t);
  $("#sc").textContent=G.score;$("#pl").textContent=G.placed;
  const twin=hit!==target?` (same rivers as ${D[target].name}!)`:"";
  toast(`✅ Correct! Those are the rivers of ${d.name}${twin}. +${pts} points`,"ok");G.i++;
  if(G.i>=D.length){finish(false)}else{sync(false);spawn()}
 }else{
  G.pw++;G.wrong++;G.score=Math.max(0,G.score-20);
  $("#sc").textContent=G.score;
  toast(`❌ ${D[hit].name} doesn’t have those rivers — look again! −20 points`,"bad")}}
function finish(forced){
 if(G.done)return;G.done=true;stopTick();const secs=Math.round((Date.now()-G.t0)/1000);
 const bonus=forced?0:finishBonus(secs);G.score+=bonus;G.tm=secs;
 $("#sc")&&($("#sc").textContent=G.score);sync(true);
 const g=$("#g3");g&&g.replaceChildren();
 dPaths.forEach((p,i)=>{if(!p.dataset.done){p.setAttribute("fill",D[i].col);p.setAttribute("stroke","#fff");p.setAttribute("stroke-dasharray","none");
  const t=document.createElementNS(NS,"text");t.setAttribute("x",D[i].cx);t.setAttribute("y",D[i].cy+2.5);t.setAttribute("class","lab");t.textContent=D[i].name;$("#g2").appendChild(t)}});
 const key=el(`<div class="card key" style="margin-top:12px"><h2>🗺️ Answer key — rivers by district</h2>${D.map((d,i)=>`<p><b style="color:${d.col}">●</b> <b>${d.name}:</b> ${RIV[i].join(", ")}</p>`).join("")}</div>`);
 $("#board").parentElement.appendChild(key);
 let rank="";if(R&&role==="student"){const S=R.peers().filter(p=>p.presence.role==="s").sort((a,b)=>(b.presence.sc||0)-(a.presence.sc||0)||(a.presence.tm||0)-(b.presence.tm||0));const k=S.findIndex(p=>p.isMe&&p.sameTab);if(k>=0)rank=` · Rank #${k+1} of ${S.length} so far`}
 toast(`🎉 ${forced?"Game ended":`All ${D.length} districts found!`} Score ${G.score}${bonus?" (incl. +"+bonus+" speed bonus)":""} · Time ${fmt(secs)}${rank}`,"ok")}

home();
</script></body></html>
